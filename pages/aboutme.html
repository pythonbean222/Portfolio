<body onload="typewriter">
    <header>
        <h1 id="name"></h1>

        <script>
            var i = 0;
            var txt = "Bryanna Rosales-Hernandez";
            var speed = 50;

            function typewriter() {
                if (i < txt.length) {
                    document.getElementById("name").innerHTML += txt.charAt(i);
                    i++;
                    setTimeout(typewriter,speed);
                }
            }
            typewriter();
        </script>
    </header>
